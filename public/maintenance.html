<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Volvemos pronto | Blue Ocean Paracas</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background: #092f40;
        color: #fff;
        font:
          14px Arial,
          sans-serif;
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .copy {
        padding: 60px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
      }
      .copy img {
        width: 95px;
        height: 95px;
        border-radius: 50%;
        margin-bottom: 60px;
      }
      .label {
        font-size: 10px;
        letter-spacing: 0.18em;
        color: #add7d6;
      }
      h1 {
        font:
          normal clamp(45px, 6vw, 80px)/1.04 Georgia,
          serif;
        letter-spacing: -0.04em;
        margin: 25px 0;
      }
      h1 em {
        color: #add7d6;
      }
      p {
        max-width: 360px;
        line-height: 1.9;
        color: #bed0d2;
      }
      .line {
        width: 50px;
        height: 3px;
        background: #fc0;
        margin-top: 35px;
      }
      .photo {
        background: url('/gallery/reserva/reserva.jpeg') center/cover;
      }
      .note {
        margin-top: 30px;
        font-size: 9px;
        letter-spacing: 0.15em;
      }
      @media (max-width: 700px) {
        body {
          grid-template-columns: 1fr;
        }
        .copy {
          padding: 40px 25px;
        }
        .copy img {
          margin-bottom: 35px;
        }
        .photo {
          min-height: 260px;
        }
      }
    </style>
  </head>
  <body>
    <main class="copy">
      <img src="/logo.png" alt="Blue Ocean Adventure Tours Paracas" /><span
        class="label"
        >BLUE OCEAN / PARACAS</span
      >
      <h1>Una pequeña pausa.<br /><em>Volvemos pronto.</em></h1>
      <p>
        Estamos realizando mejoras en nuestra web. Pronto podrás volver a
        explorar nuestras experiencias.
      </p>
      <div class="line"></div>
      <p class="note">EL MAR Y EL DESIERTO SIGUEN AQUÍ.</p>
    </main>
    <div
      class="photo"
      role="img"
      aria-label="Reserva Nacional de Paracas"
    ></div>
  </body>
</html>
